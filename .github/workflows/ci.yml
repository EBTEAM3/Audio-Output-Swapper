name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Must be Windows: the project targets net10.0-windows and uses WPF.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/AudioSwapper/AudioSwapper.csproj

      - name: Build
        run: dotnet build src/AudioSwapper/AudioSwapper.csproj -c Release --no-restore -warnaserror

      - name: Check every device icon path parses
        # The app deliberately swallows a malformed icon path so one bad glyph
        # cannot take the tray down, which means this harness is the only place
        # it would ever be noticed. It exits non-zero on a bad path.
        run: dotnet run --project tools/IconSheet/IconSheet.csproj -c Release -- "${{ runner.temp }}/tray-icons.png"

      - name: Publish standalone exe
        run: pwsh -File build.ps1 -Output "${{ runner.temp }}/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: AudioSwapper-${{ github.sha }}
          path: ${{ runner.temp }}/dist/AudioSwapper.exe
          if-no-files-found: error
